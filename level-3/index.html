:root { --bg: #04070a; --ink: #7fb596; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  min-height: 100vh;
}
body::after {
  content: "";

  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(

    rgba(255, 255, 255, 0.015) 0px,

}
.wrap {

}

  min-height: 320px;

  border: 1px solid rgba(127, 181, 150, 0.28);
  background: rgba(127, 181, 150, 0.04);
  box-shadow: 0 0 26px rgba(127, 181, 150, 0.10) inset, 0 0 18px rgba(127, 181, 150, 0.08);
}
@media (max-width: 640px) {

}
